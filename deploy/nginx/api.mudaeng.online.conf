# api.mudaeng.online → Nest api (pm2 nest-api, 127.0.0.1:3000)
#
# 설치 (Lightsail Ubuntu, nginx.org 공식 패키지)
#   `http2 on;`은 nginx 1.25.1 이상에서만 동작한다. Ubuntu 기본 패키지(24.04 = 1.24)는 이 지시어를 몰라
#   nginx -t가 실패하므로, nginx.org 저장소의 stable(1.26 이상)을 쓴다.
#   1. nginx.org 저장소 추가 후 설치 (Ubuntu nginx가 있으면 먼저 sudo apt remove nginx nginx-common nginx-core)
#        curl -fsSL https://nginx.org/keys/nginx_signing.key | gpg --dearmor | sudo tee /usr/share/keyrings/nginx-archive-keyring.gpg >/dev/null
#        echo "deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] http://nginx.org/packages/ubuntu $(lsb_release -cs) nginx" | sudo tee /etc/apt/sources.list.d/nginx.list
#        printf "Package: *\nPin: origin nginx.org\nPin: release o=nginx\nPin-Priority: 900\n" | sudo tee /etc/apt/preferences.d/99nginx
#        sudo apt update && sudo apt install -y nginx && nginx -v
#   2. 인증서 (certbot으로 발급됨: /etc/letsencrypt/live/api.mudaeng.online/, options-ssl-nginx.conf, ssl-dhparams.pem)
#      서버를 옮길 때는 기존 서버의 /etc/letsencrypt를 그대로 가져온다 (심볼릭 링크가 유지되게 tar 사용)
#        기존 서버: sudo tar czf - -C / etc/letsencrypt > letsencrypt.tgz   새 서버: sudo tar xzf letsencrypt.tgz -C /
#   3. 설정 복사: nginx.org 패키지는 sites-enabled가 아니라 /etc/nginx/conf.d/*.conf만 읽는다
#        sudo cp deploy/nginx/api.mudaeng.online.conf /etc/nginx/conf.d/api.mudaeng.online.conf
#        sudo rm -f /etc/nginx/conf.d/default.conf   (80 포트를 먼저 잡아 기본 페이지가 나옴)
#        sudo mkdir -p /var/www/html                 (아래 certbot HTTP-01 챌린지 경로)
#   4. sudo nginx -t && sudo systemctl enable --now nginx && sudo systemctl reload nginx
#   5. curl -i "https://api.mudaeng.online/securities?keyword=AAPL"   → 200
#      https://api.mudaeng.online/auth/google                          → Google 로그인으로 302
#      DNS를 바꾸기 전에는: curl -sk --resolve api.mudaeng.online:443:127.0.0.1 "https://api.mudaeng.online/securities?keyword=AAPL"
#
# 바꾼 뒤 인증서 자동 갱신이 되는지 sudo certbot renew --dry-run 으로 확인.

server {
    listen 80;
    listen [::]:80;
    server_name api.mudaeng.online;

    # certbot HTTP-01 챌린지는 리다이렉트하지 않고 통과
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.mudaeng.online;

    ssl_certificate /etc/letsencrypt/live/api.mudaeng.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mudaeng.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # main.ts의 trust proxy가 이 헤더로 https·클라이언트 IP를 판단 (secure 쿠키에 필요)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 하루 첫 조회는 외부 API(KIS·Massive·data.go.kr)로 갱신하느라 오래 걸릴 수 있음
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
