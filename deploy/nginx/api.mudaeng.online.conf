# api.mudaeng.online → Nest api (pm2 nest-api, 127.0.0.1:3000)
#
# 설치 (EC2, 인증서는 certbot으로 이미 발급됨: /etc/letsencrypt/live/api.mudaeng.online/)
#   1. 기존에 api.mudaeng.online을 잡고 있는 블록 제거
#        sudo grep -Rln "api.mudaeng.online" /etc/nginx/   (-R: sites-enabled의 심볼릭 링크도 따라감)
#      → default 사이트에 certbot이 붙인 443/80 블록이 있으면 그 server 블록을 지운다
#        (같은 server_name이 둘이면 먼저 읽힌 쪽이 쓰여 계속 기본 페이지가 나올 수 있음)
#   2. sudo cp deploy/nginx/api.mudaeng.online.conf /etc/nginx/sites-available/api.mudaeng.online
#      sudo ln -sf /etc/nginx/sites-available/api.mudaeng.online /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. curl -i "https://api.mudaeng.online/securities?keyword=AAPL"   → 200
#      https://api.mudaeng.online/auth/google                          → Google 로그인으로 302
#
# 바꾼 뒤 인증서 자동 갱신이 되는지 sudo certbot renew --dry-run 으로 확인.

server {
    listen 80;
    listen [::]:80;
    server_name api.mudaeng.online;

    # certbot HTTP-01 챌린지는 리다이렉트하지 않고 통과
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.mudaeng.online;

    ssl_certificate /etc/letsencrypt/live/api.mudaeng.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mudaeng.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # main.ts의 trust proxy가 이 헤더로 https·클라이언트 IP를 판단 (secure 쿠키에 필요)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 하루 첫 조회는 외부 API(KIS·Massive·data.go.kr)로 갱신하느라 오래 걸릴 수 있음
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
