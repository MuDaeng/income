name: Deploy to EC2

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        shell: bash
        run: |
          set -e
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          cd ~/income
          git pull origin master
          npm ci
          npm run build
          pm2 reload nest-api --update-env || pm2 start dist/apps/api/main.js --name nest-api
          pm2 save

      - name: Health check
        shell: bash
        run: |
          # 공개 API + DB 조회까지 확인 (결과가 없어도 200)
          url="http://127.0.0.1:3000/securities?keyword=AAPL"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
            if [ "$code" = "200" ]; then echo "healthy (HTTP 200)"; exit 0; fi
            echo "attempt $i: HTTP $code"
            sleep 3
          done
          echo "health check failed (last HTTP $code)"
          pm2 logs nest-api --lines 50 --nostream || true
          exit 1